# Build settings live here so they travel with the code.
[build]
  command = "npm run build"
  publish = "dist"

# Fingerprinted build assets and the font files never change under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
